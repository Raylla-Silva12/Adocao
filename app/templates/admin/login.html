{% extends "base.html" %}
{% block title %}Login — Admin{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2.5rem;">🔐</span>
    </div>
    <h1>Área administrativa</h1>
    <p>Entre para cadastrar e gerenciar os pets.</p>
    <form id="loginForm" class="auth-form" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="username" value="admin@example.com" placeholder="seu@email.com">

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" value="admin123" placeholder="••••••••">

      <p id="loginError" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="auth-hint">Credenciais padrão: admin@example.com / admin123</p>
    <a href="{{ url_for('web.home') }}" class="back-link">← Voltar ao site</a>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', handleLogin);
</script>
{% endblock %}
