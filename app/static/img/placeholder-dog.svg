<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#F1F5F9"/>
  
  <!-- Dog silhouette -->
  <g transform="translate(200, 150)">
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="50" ry="38" fill="#CBD5E1"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-15" rx="40" ry="35" fill="#CBD5E1"/>
    
    <!-- Ears (floppy) -->
    <ellipse cx="-35" cy="-10" rx="18" ry="30" fill="#94A3B8" transform="rotate(-15 -35 -10)"/>
    <ellipse cx="35" cy="-10" rx="18" ry="30" fill="#94A3B8" transform="rotate(15 35 -10)"/>
    
    <!-- Snout -->
    <ellipse cx="0" cy="5" rx="22" ry="18" fill="#E2E8F0"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-20" r="6" fill="#94A3B8"/>
    <circle cx="15" cy="-20" r="6" fill="#94A3B8"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#64748B"/>
    
    <!-- Tail -->
    <path d="M50 30 Q85 10 80 -20" stroke="#CBD5E1" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="250" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="500">Foto do cachorro</text>
</svg>
