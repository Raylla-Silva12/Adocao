<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#F1F5F9"/>
  
  <!-- Cat silhouette -->
  <g transform="translate(200, 150)">
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="45" ry="35" fill="#CBD5E1"/>
    
    <!-- Head -->
    <circle cx="0" cy="-15" r="38" fill="#CBD5E1"/>
    
    <!-- Ears -->
    <path d="M-30 -40 L-40 -75 L-15 -50 Z" fill="#CBD5E1"/>
    <path d="M30 -40 L40 -75 L15 -50 Z" fill="#CBD5E1"/>
    <path d="M-28 -42 L-35 -65 L-18 -50 Z" fill="#E2E8F0"/>
    <path d="M28 -42 L35 -65 L18 -50 Z" fill="#E2E8F0"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-20" r="6" fill="#94A3B8"/>
    <circle cx="15" cy="-20" r="6" fill="#94A3B8"/>
    
    <!-- Nose -->
    <path d="M0 -5 L-5 3 L5 3 Z" fill="#94A3B8"/>
    
    <!-- Tail -->
    <path d="M45 35 Q80 20 75 -10" stroke="#CBD5E1" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="250" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="500">Foto do gato</text>
</svg>
