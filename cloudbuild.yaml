steps:
  # Build the image (--no-cache garante que templates/static novos entrem na imagem)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/adocao-gatos:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/adocao-gatos:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/adocao-gatos:$SHORT_SHA'

images:
  - 'gcr.io/$PROJECT_ID/adocao-gatos:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/adocao-gatos:latest'

timeout: '3600s'
