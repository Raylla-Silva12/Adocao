steps:
  # Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/adocao-gatos:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/adocao-gatos:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/adocao-gatos:$SHORT_SHA'

  # Deploy using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'adocao-gatos'
      - '--image=gcr.io/$PROJECT_ID/adocao-gatos:$SHORT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars=FLASK_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/adocao-gatos:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/adocao-gatos:latest'

timeout: '3600s'
